# Signal Desktop — personal deployment.
# Pull the latest image:  docker compose pull && docker compose up -d
# Build locally instead:  docker compose up -d --build
services:
  signal:
    image: ghcr.io/qualifiedvirtue/signal:latest
    build:
      context: .
      args:
        VERSION: local
        # Uncomment to pin a specific Signal version for reproducible builds:
        # SIGNAL_VERSION: "8.12.0-1"
    container_name: signal
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
    ports:
      # Bound to localhost — expose via your reverse proxy only.
      - "127.0.0.1:3001:3001"
    shm_size: "1gb"
    restart: unless-stopped
