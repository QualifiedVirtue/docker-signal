---

# project information
project_name: signal
project_url: "https://signal.org/"
project_logo: "https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/signal-logo.png"
project_blurb: "[Signal]({{ project_url }}) is a messaging app with privacy at its core. It is free and easy to use, with strong end-to-end encryption that keeps your communication completely private."
project_lsio_github_repo_url: "https://github.com/linuxserver/docker-{{ project_name }}"
project_blurb_optional_extras_enabled: false
project_categories: "Chat"
# supported architectures
available_architectures:
  - {arch: "{{ arch_x86_64 }}", tag: "latest"}
# development version
development_versions: false
# container parameters
common_param_env_vars_enabled: true
param_container_name: "{{ project_name }}"
param_usage_include_vols: true
param_volumes:
  - {vol_path: "/config", vol_host_path: "/path/to/config", desc: "Users home directory in the container, stores local files and settings"}
param_usage_include_ports: true
param_ports:
  - {external_port: "3000", internal_port: "3000", port_desc: "Signal desktop gui HTTP must be proxied."}
  - {external_port: "3001", internal_port: "3001", port_desc: "Signal desktop gui HTTPS."}
opt_param_usage_include_env: true
opt_param_env_vars:
  - {env_var: "SIGNAL_SANDBOX", env_value: "false", desc: "Set to `true` to re-enable the Chromium/Electron sandbox. Only works on hosts that permit unprivileged user namespaces (or the setuid sandbox helper); leave unset/`false` otherwise or Signal will fail to start."}
custom_params:
  - {name: "shm-size", name_compose: "shm_size", value: "1gb", desc: "Recommended for all desktop images."}
# Selkies blurb settings
selkies_blurb: true
show_nvidia: true
# application setup block
app_setup_block_enabled: true
app_setup_block: |
  The application can be accessed at:

  * https://yourhost:3001/

  >[!WARNING]
  >This container does not encrypt Signal's config.json using a secret manager like gnome-keyring or kwallet, the file is stored in plaintext.

  ### Chromium/Electron sandbox (`SIGNAL_SANDBOX`)

  Signal runs with the Chromium/Electron sandbox **disabled by default** (`--no-sandbox`), because the sandbox needs either unprivileged user namespaces or a setuid helper, which a generic container host cannot guarantee.

  If you control the host you can re-enable the sandbox by setting `-e SIGNAL_SANDBOX=true`. Be aware:

  >[!WARNING]
  >If you set `SIGNAL_SANDBOX=true` but the host provides **neither** a working sandbox mechanism, **Signal will fail to start** ("Running as root without --no-sandbox is not supported"). The default (`false`) is the safe, always-working setting.

  For the sandbox to actually work, the host must provide one of:
  * **Namespace sandbox (preferred):** unprivileged user namespaces enabled on the host (e.g. `sysctl kernel.unprivileged_userns_clone=1`) while running under Docker's **default** seccomp profile.
  * **setuid sandbox (fallback):** the bundled `chrome-sandbox` helper is already shipped setuid-root in the image, so this path works under default Docker without host sysctl tuning.

  >[!CAUTION]
  >Do **not** try to make the sandbox work by passing `--security-opt seccomp=unconfined` or `--cap-add SYS_ADMIN`. These re-enable the sandbox but hand back more privilege than the sandbox protects, so the net result is no better (and likely worse) than leaving `SIGNAL_SANDBOX` off.
# init diagram
init_diagram: |
  "signal:latest": {
    docker-mods
    base {
      fix-attr +\nlegacy cont-init
    }
    docker-mods -> base
    legacy-services
    custom services
    init-services -> legacy-services
    init-services -> custom services
    custom services -> legacy-services
    legacy-services -> ci-service-check
    init-migrations -> init-adduser
    init-os-end -> init-config
    init-selkies-end -> init-config
    init-config -> init-config-end
    init-crontab-config -> init-config-end
    init-config -> init-crontab-config
    init-mods-end -> init-custom-files
    init-adduser -> init-device-perms
    base -> init-envfile
    base -> init-migrations
    init-config-end -> init-mods
    init-mods-package-install -> init-mods-end
    init-mods -> init-mods-package-install
    init-selkies -> init-nginx
    init-adduser -> init-os-end
    init-device-perms -> init-os-end
    init-envfile -> init-os-end
    init-os-end -> init-selkies
    init-nginx -> init-selkies-config
    init-video -> init-selkies-end
    init-custom-files -> init-services
    init-selkies-config -> init-video
    init-services -> svc-cron
    svc-cron -> legacy-services
    init-services -> svc-de
    svc-nginx -> svc-de
    svc-xorg -> svc-de
    svc-de -> legacy-services
    init-services -> svc-docker
    svc-docker -> legacy-services
    init-services -> svc-nginx
    svc-nginx -> legacy-services
    init-services -> svc-pulseaudio
    svc-pulseaudio -> legacy-services
    init-services -> svc-selkies
    svc-nginx -> svc-selkies
    svc-pulseaudio -> svc-selkies
    svc-xorg -> svc-selkies
    svc-selkies -> legacy-services
    init-services -> svc-watchdog
    svc-watchdog -> legacy-services
    init-services -> svc-xorg
    svc-xorg -> legacy-services
    init-services -> svc-xsettingsd
    svc-nginx -> svc-xsettingsd
    svc-xorg -> svc-xsettingsd
    svc-xsettingsd -> legacy-services
  }
  Base Images: {
    "baseimage-selkies:arch" <- "baseimage-arch:latest"
  }
  "signal:latest" <- Base Images
# changelog
changelogs:
  - {date: "29.05.26:", desc: "Remove bundled Chromium browser, add opt-in SIGNAL_SANDBOX to re-enable the Chromium/Electron sandbox."}
  - {date: "04.04.26:", desc: "Make Wayland default disable with PIXELFLUX_WAYLAND=false."}
  - {date: "21.03.26:", desc: "Use Wayland ozone platform fixes scaling and acceleration."}
  - {date: "28.12.25:", desc: "Add Wayland init logic."}
  - {date: "02.12.25:", desc: "Initial Version."}
